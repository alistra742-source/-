<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guns.lol view runner</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --line: #232a33; --ink: #e7edf3;
    --dim: #8b98a5; --accent: #7ee787; --warn: #f0b429; --bad: #ff6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3b4550; box-shadow: 0 0 0 0 rgba(126,231,135,.5); }
  .dot.on { background: var(--accent); animation: pulse 1.6s infinite; }
  .dot.err { background: var(--bad); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(126,231,135,.45); } 70% { box-shadow: 0 0 0 9px rgba(126,231,135,0); } 100% { box-shadow: 0 0 0 0 rgba(126,231,135,0); } }
  .grow { flex: 1; }
  .badge { font: 12px var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .9px; color: var(--dim); font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  .field { display: flex; align-items: stretch; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0e1116; }
  .field .prefix { display: flex; align-items: center; padding: 0 12px; font: 14px var(--mono); color: var(--dim); background: #161b22; border-right: 1px solid var(--line); }
  input[type=text], input[type=number], textarea { background: transparent; border: 0; color: var(--ink); font: 14px var(--mono); padding: 11px 12px; width: 100%; outline: none; }
  textarea { background: #0e1116; border: 1px solid var(--line); border-radius: 8px; min-height: 118px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  button { font: 600 14px system-ui, sans-serif; border-radius: 8px; border: 1px solid var(--line); padding: 11px 18px; cursor: pointer; background: #1a2029; color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06130a; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: #0e1116; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font: 700 20px var(--mono); }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .7px; }
  .logwrap { grid-column: 1 / -1; }
  pre.log { margin: 0; height: 320px; overflow: auto; font: 12.5px/1.65 var(--mono); background: #0a0c0f; border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  pre.log .hit { color: var(--accent); } pre.log .miss { color: var(--bad); } pre.log .warn { color: var(--warn); } pre.log .dim { color: var(--dim); }
  .msg { font-size: 13px; min-height: 18px; color: var(--dim); }
  .msg.err { color: var(--bad); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>guns.lol view runner</h1>
  <span class="badge" id="modeBadge">idle</span>
  <span class="grow"></span>
  <span class="badge" id="linkBadge">connecting…</span>
</header>

<main>
  <section class="panel">
    <h2>Target</h2>
    <label for="target">profile to load</label>
    <div class="field">
      <span class="prefix">guns.lol/</span>
      <input id="target" type="text" placeholder="username" autocomplete="off" spellcheck="false">
    </div>

    <label for="proxies">proxies — one per line (empty = use proxies.txt, and if that's empty, Tor)</label>
    <textarea id="proxies" spellcheck="false" placeholder="host:port&#10;host:port:user:pass&#10;socks5://user:pass@host:1080"></textarea>

    <div class="row" style="margin-top:14px">
      <div>
        <label for="browsers">browsers</label>
        <div class="field"><input id="browsers" type="number" min="1" max="8" value="2"></div>
      </div>
      <div>
        <label for="pages">pages each</label>
        <div class="field"><input id="pages" type="number" min="1" max="10" value="5"></div>
      </div>
    </div>

    <div class="actions">
      <button id="startBtn" class="primary">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <span class="msg" id="msg"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Live</h2>
    <div class="stats">
      <div class="stat"><b id="sHits">0</b><span>hits</span></div>
      <div class="stat"><b id="sErrors">0</b><span>errors</span></div>
      <div class="stat"><b id="sWorkers">0</b><span>workers</span></div>
      <div class="stat"><b id="sUptime">0s</b><span>uptime</span></div>
    </div>
    <div style="margin-top:14px">
      <label>egress</label>
      <div class="badge" id="egressBadge">—</div>
    </div>
  </section>

  <section class="panel logwrap">
    <h2>Log</h2>
    <pre class="log" id="log"></pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
let lastState = null;

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function appendLog(entry) {
  const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 40;
  const cls = entry.level === 'hit' ? 'hit' : entry.level === 'miss' ? 'miss' : entry.level === 'warn' ? 'warn' : 'dim';
  const ts = new Date(entry.t).toLocaleTimeString();
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = `[${esc(ts)}] ${esc(entry.tag)} ${esc(entry.msg)}`;
  logEl.appendChild(div);
  while (logEl.childElementCount > 800) logEl.removeChild(logEl.firstChild);
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function render(state) {
  if (!state) return;
  lastState = state;
  $('sHits').textContent = state.hits;
  $('sErrors').textContent = state.errors;
  $('sWorkers').textContent = state.running ? state.browsers * state.pages : 0;
  $('sUptime').textContent = state.running ? Math.floor(state.uptime / 1000) + 's' : '0s';
  $('startBtn').disabled = state.running;
  $('stopBtn').disabled = !state.running;
  const dot = $('dot');
  dot.className = 'dot' + (state.running ? ' on' : state.errors && !state.running ? ' err' : '');
  $('modeBadge').textContent = state.running ? (state.headless ? 'running · headless' : 'running · headful') : 'idle';
  $('egressBadge').textContent = state.running
    ? (state.mode === 'tor' ? 'tor · fresh circuit per hit' : state.proxyCount + ' proxies · round-robin')
    : '—';
}

async function refresh() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    render(await r.json());
  } catch { /* server restarting; the next tick catches up */ }
}

function showMsg(text, isErr) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = 'msg' + (isErr ? ' err' : '');
}

$('startBtn').addEventListener('click', async () => {
  showMsg('starting…');
  try {
    const r = await fetch('/api/start', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        target: $('target').value.trim(),
        proxies: $('proxies').value,
        browsers: Number($('browsers').value),
        pages: Number($('pages').value),
        headless: true,
      }),
    });
    const j = await r.json();
    if (!r.ok) { showMsg(j.error || 'start failed', true); return; }
    showMsg('');
    render(j.status);
  } catch (e) { showMsg('start failed: ' + e.message, true); }
});

$('stopBtn').addEventListener('click', async () => {
  showMsg('stopping…');
  try {
    const r = await fetch('/api/stop', { method: 'POST' });
    const j = await r.json();
    render(j.status);
    showMsg('');
  } catch (e) { showMsg('stop failed: ' + e.message, true); }
});

function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('linkBadge').textContent = 'connected'; };
  es.onmessage = (ev) => {
    try {
      const { type, data } = JSON.parse(ev.data);
      if (type === 'log') appendLog(data);
      else if (type === 'state') render(data);
    } catch { /* keep the stream alive on a bad frame */ }
  };
  es.onerror = () => {
    $('linkBadge').textContent = 'reconnecting…';
    es.close();
    setTimeout(connect, 1500);
  };
}

connect();
refresh();
setInterval(refresh, 2000);
setInterval(() => { if (lastState && lastState.running) render({ ...lastState, uptime: Date.now() - lastState.startedAt }); }, 1000);
</script>
</body>
</html>
